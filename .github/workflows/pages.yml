# Deploys this repository to GitHub Pages on every push (`mctas site preview`, docs/site.md of
# github.com/vjeux/redstonepedia): a custom workflow has no 10-builds-an-hour cap. No shell steps.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# a newer push replaces a deploy in progress: it holds every preview too
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
